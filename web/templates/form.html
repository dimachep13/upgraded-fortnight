{{define "content"}}
<h2>Добавить новый расход</h2>

<div class="form-container">
    <form method="POST" action="/save">
        <div class="form-group">
            <label>Описание траты:</label>
            <input type="text" name="description" required placeholder="Например: Купил проездной">
        </div>

        <div class="form-group">
            <label>Выберите категорию:</label>
            <select name="category_id" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                {{range .}}
                <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>
        </div>

        <div class="form-group">
            <label>Сумма в рублях:</label>
            <input type="number" step="0.01" name="amount" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label>Дата покупки:</label>
            <input type="date" name="date" required>
        </div>

        <button type="submit">Сохранить трату</button>
    </form>
</div>
{{end}}
