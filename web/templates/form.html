{{define "content"}}
<h2>{{if .IsEdit}}Редактировать расход{{else}}Добавить новый расход{{end}}</h2>

{{if .ErrorMsg}}
<div style="background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; margin-bottom: 15px; width: 420px;">
    {{.ErrorMsg}}
</div>
{{end}}

<div class="form-container">
    <form method="POST" action="{{if .IsEdit}}/update{{else}}/save{{end}}">
        
        {{if .IsEdit}}
        <input type="hidden" name="id" value="{{.Expense.ID}}">
        {{end}}

        <div class="form-group">
            <label>Описание траты:</label>
            <input type="text" name="description" value="{{.Expense.Description}}" placeholder="Например: Продукты">
        </div>

        <div class="form-group">
            <label>Выберите категорию:</label>
            <select name="category_id" style="width: 100%; padding: 8px; box-sizing: border-box;">
                {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </div>

        <div class="form-group">
            <label>Сумма в рублях:</label>
            <input type="number" step="0.01" name="amount" value="{{if ne .Expense.Amount 0.0}}{{.Expense.Amount}}{{end}}" placeholder="0.00">
        </div>

        <div class="form-group">
            <label>Дата покупки:</label>
            <input type="date" name="date" value="{{.Expense.Date}}">
        </div>

        <button type="submit">{{if .IsEdit}}Сохранить изменения{{else}}Добавить трату{{end}}</button>
    </form>
</div>
{{end}}
