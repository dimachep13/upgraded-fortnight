{{define "content"}}
<h2>История моих расходов</h2>

<form method="GET" action="/" style="margin-bottom: 20px; background: #eee; padding: 15px; border-radius: 5px;">
    <label>Категория: 
        <select name="category">
            <option value="">Все категории</option>
            {{range .Categories}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select>
    </label>
    
    <label style="margin-left: 15px;">От: <input type="date" name="from"></label>
    <label style="margin-left: 15px;">До: <input type="date" name="to"></label>
    
    <button type="submit" style="margin-left: 15px; background: #007bff; padding: 5px 10px;">Применить</button>
    <a href="/" style="margin-left: 10px; color: #666; text-decoration: none;">Сбросить</a>
</form>

<table>
    <thead>
        <tr>
            <th>Описание</th>
            <th>Категория</th>
            <th>Сумма (руб.)</th>
            <th>Дата</th>
        </tr>
    </thead>
    <tbody>
        {{range .Expenses}}
        <tr>
            <td>{{.Description}}</td>
            <td><strong>{{.CategoryName}}</strong></td>
            <td>{{.Amount}}</td>
            <td>{{.Date}}</td>
        </tr>
        {{else}}
        <tr>
            <td colspan="4" style="text-align: center;">Ничего не найдено по выбранным фильтрам.</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
